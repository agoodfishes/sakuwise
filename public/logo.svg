<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 110" fill="none">
  <!-- S Ribbon Icon -->
  <g transform="translate(10, 12)">
    <!-- Top Fold (Amber / Gold) -->
    <path
      d="M48 6 C32 6 20 13 12 24 C10 27 12 31 16 33 L62 45 C70 47 79 43 82 35 C86 24 76 6 48 6 Z"
      fill="url(#sw-amber-grad)"
    />
    <path
      d="M50 6 C68 6 84 15 83 29 C82.5 35 74 41 64 39 L26 30 C22 29 21 24 24 22 C31 14 39 6 50 6 Z"
      fill="#E09B35"
    />
    <!-- Mid Shadow -->
    <path
      d="M24 30 L70 42 C66 50 56 54 46 54 L22 50 C16 49 13 44 16 39 L24 30 Z"
      fill="#233E2B"
      opacity="0.85"
    />
    <!-- Bottom Fold (Dark Forest Green) -->
    <path
      d="M46 53 L76 61 C82 62.5 85 68 81 73 C73 82 60 86 46 86 C26 86 12 76 14 62 C15 54 24 49 36 51 L68 57"
      fill="url(#sw-green-grad)"
    />
    <path
      d="M14 64 C13 74 26 86 48 86 C68 86 82 77 79 66 C77.5 60 70 56 62 55 L24 49 C17 48 14 54 14 64 Z"
      fill="#2A4D35"
    />
    <!-- Ribbon Inner Highlight -->
    <path
      d="M30 36 L66 45 C60 50 48 51 38 49 L24 45 C22 44 22 40 25 38 L30 36 Z"
      fill="#FFFFFF"
      opacity="0.25"
    />
  </g>

  <!-- Typography: Saku (Dark Forest Green) and wise (Amber Gold) -->
  <text x="125" y="60" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    <tspan fill="#233F2E">Saku</tspan><tspan fill="#DE9B35">wise</tspan>
  </text>

  <!-- Tagline -->
  <text x="128" y="85" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="500" fill="#6B7F72" letter-spacing="0">
    Manage your money, wisely
  </text>

  <defs>
    <linearGradient id="sw-amber-grad" x1="20" y1="10" x2="80" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5B342" />
      <stop offset="1" stop-color="#DE9B35" />
    </linearGradient>
    <linearGradient id="sw-green-grad" x1="20" y1="50" x2="80" y2="86" gradientUnits="userSpaceOnUse">
      <stop stop-color="#365C40" />
      <stop offset="1" stop-color="#1E3826" />
    </linearGradient>
  </defs>
</svg>
